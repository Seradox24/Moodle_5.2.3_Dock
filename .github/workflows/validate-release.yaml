name: Validate release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Shell syntax and independent profiles
        run: |
          find scripts docker -name '*.sh' -exec sh -n {} \;
          env -u TZ python3 tests/profiles.py
          python3 tests/backup-retention.py
      - name: Fresh installation, operation and recovery
        run: env -u TZ python3 tests/release-integration.py
