server {
    listen 80 default_server;
    server_name _;

    root /var/www/moodle/public;
    index index.php;
    autoindex off;

    # Operational limits generated at container start from the selected profile
    # (client_max_body_size and fastcgi_read_timeout). The image defines
    # fallback env values for standalone runs.
    include /tmp/nginx-conf.d/*.conf;

    # Local probe: Moodle pages can redirect to the external IP and port.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }

    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name $fastcgi_script_name/ /r.php$is_args$args;

        include fastcgi_params;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Forward the central proxy headers to PHP; without these Moodle cannot
        # detect HTTPS in sslproxy mode and answers 500.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_SERVER $http_x_forwarded_server;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_FORWARDED $http_forwarded;

        # Re-resolve app after container recreation (Docker's embedded DNS).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }
}
